services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: capteurs_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt_broker/mosquitto.conf:/mosquitto/config/mosquitto.conf

  web:
    build: .
    container_name: capteurs_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mqtt

  mqtt_worker:
    build: .
    container_name: capteurs_mqtt_worker
    command: python manage.py mqtt_worker
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - mqtt

  sensor_sim:
    build: .
    container_name: capteurs_sensor_sim
    command: python sensor_simulators/simulator.py
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - mqtt