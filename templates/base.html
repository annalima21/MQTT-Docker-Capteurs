<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Capteurs IoT{% endblock %} — Plateforme IoT</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        footer {
            border-top: 1px solid #dee2e6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .actions a,
        .button {
            display: inline-block;
            margin-right: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            background: #2563eb;
            color: white;
            border: 0;
            cursor: pointer;
        }

        .danger {
            background: #dc2626;
        }

        .secondary {
            background: #6b7280;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            max-width: 600px;
            padding: 8px;
        }

        .status-ok {
            color: #15803d;
            font-weight: bold;
        }

        .status-ko {
            color: #b91c1c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:accueil' %}">
            Capteurs IoT
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false"
                aria-label="Afficher/masquer la navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:accueil' %}">
                        Accueil
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:liste_capteurs' %}">
                        Capteurs
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:capteur_create' %}">
                        Ajouter un capteur
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:liste_sites' %}">
                        Sites
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'alertes:liste_alertes' %}">
                        Alertes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'analytics:liste_derives' %}">
                        Dérives
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">
                        Admin
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="container py-3 mt-4 text-muted small text-center">
    Plateforme de gestion de capteurs intelligents — Projet BUT3 GEII
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
